apiVersion: apps/v1
kind: Deployment
metadata:
  name: waste-classifier-deployment
  labels:
    app: waste-classifier
spec:
  replicas: 3
  selector:
    matchLabels:
      app: waste-classifier
  template:
    metadata:
      labels:
        app: waste-classifier
    spec:
      containers:
      - name: classifier
        image: waste-classifier:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        livenessProbe:
          httpGet:
            path: /api/info
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/info
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: waste-classifier-service
spec:
  type: LoadBalancer
  selector:
    app: waste-classifier
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: waste-classifier-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: waste-classifier-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
